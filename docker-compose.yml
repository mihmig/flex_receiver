name: flex

services:
  flex-db:
    image: mariadb:11.4
    container_name: flex-db
    ports:
      - "127.0.0.1:8003:3306"
    environment:
      - TZ=Europe/Moscow
      - MYSQL_ROOT_PASSWORD=gnss
      - MYSQL_DATABASE=gnss
      - MYSQL_USER=gnss
      - MYSQL_PASSWORD=gnss
    volumes:
      - ./db_data:/var/lib/mysql
      - ./backup:/backup
    networks:
      - flex
    mem_limit: 512m  # Ограничение памяти
    mem_reservation: 128m  # Резервирование памяти
    restart: unless-stopped
    # command: --init-file /data/application/init.sql
    # docker-compose up -d flex-db
    # docker exec -it flex-db /bin/bash
  db-cleaner:
    image: mariadb:11.4
    container_name: flex-db-cleaner
    environment:
      - TZ=Europe/Moscow
      - MYSQL_DATABASE=gnss
      - MYSQL_USER=gnss
      - MYSQL_PASSWORD=gnss
    depends_on:
      - flex-db
    networks:
      - flex
    entrypoint: >
      /bin/sh -c "
      while true; do
        sleep 86400;
        mariadb -h flex-db -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} -e \"DELETE FROM message WHERE device_id=8 AND datetime < NOW() - INTERVAL 14 DAY;\";
      done"
    mem_limit: 128m  # Ограничение памяти

  flex:
    build: .  # Указываем, что образ собирается из текущей директории (где Dockerfile)
    environment:
      - TZ=Europe/Moscow
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
      - 77.88.8.8
      - 77.88.8.1
    # docker-compose up flex --build
    # docker exec -it flex /bin/bash
    container_name: flex
    env_file:
      - .env
    ports:
      - "21626:21626"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - flex-db
    networks:
      - flex
    restart: unless-stopped
    mem_limit: 256m  # Ограничение памяти
    mem_reservation: 64m  # Резервирование памяти

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gnss-pma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8017:8081"
    depends_on:
      - flex-db
    environment:
      PMA_HOST: flex-db
      PMA_PORT: 3306
      PMA_USER: gnss
      PMA_PASSWORD: gnss
    networks:
      - flex

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    environment:
      - TZ=Europe/Moscow
    command: --base-url /portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - flex
    restart: unless-stopped
    mem_limit: 256m  # Ограничение памяти
    mem_reservation: 64m  # Резервирование памяти

networks:
  flex:
    driver: bridge
