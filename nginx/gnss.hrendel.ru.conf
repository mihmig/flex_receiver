server {
   server_name  gnss.hrendel.ru;
   #access_log off;
   client_body_buffer_size 128k;

   location /.well-known/acme-challenge {
         root /usr/share/nginx/html;
   }

   location /portainer/ {
        proxy_pass http://localhost:9000/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # важно для WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # чтобы base path работал корректно
        proxy_set_header X-Forwarded-Proto $scheme;
    }
	location /gnss_database/ {
    	proxy_pass http://127.0.0.1:8017/;

	    proxy_http_version 1.1;
	    proxy_set_header Host $host;

	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}
	location / {
		root   /var/www/html/;
		index  index.html;
	}
 

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gnss.hrendel.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gnss.hrendel.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = gnss.hrendel.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


   server_name  gnss.hrendel.ru;
    listen 80;
    return 404; # managed by Certbot


}