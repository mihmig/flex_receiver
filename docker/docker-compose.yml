version: '3.8'
name: flex

services:
  mariadb:
    container_name: flex_mariadb
    image: mariadb:10.10.2
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
    volumes:
      - ./config/mariadb/data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - flex
    restart: unless-stopped
networks:
  flex:
    driver: bridge
